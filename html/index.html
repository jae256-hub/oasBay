<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oyera Welcome Page</title>
    <link rel="stylesheet" href="/css/oyera.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body action="homePage" method="POST">
    <main class="hero-shell">
      <section class="hero-card">
        <div class="hero-copy">
          <span class="hero-badge">Premium Auto Care</span>

          <h1 class="title" id="first-title">
            WELCOME TO OYERA AUTO SERVICE BAY
          </h1>

          <h2 class="title" id="second-title">
            Making roads safe one vehicle at a time.
          </h2>
        </div>

        <div class="hero-media">
          <img
            class="hero-image"
            src="https://i.pinimg.com/1200x/25/cf/08/25cf08b0c80cbb5463f88509d9230a9c.jpg"
            alt="Oyera Auto Service Bay"
          />
        </div>
      </section>
    </main>
    <div class="hero-actions">
      <a class="glass-btn" href="/login"> Login</a>
    </div>

    <script src="/js/index.js" defer></script>
    <script src="/js/homePage.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
