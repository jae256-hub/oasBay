<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Login - Oyera Auto Service Bay</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/oyera.css" />
  </head>
  <body id="customerLogin">
    <div class="login-container">
      <div class="login-header">
        <h1>Customer Login</h1>
        <p>Welcome back to Oyera Auto Service Bay</p>
      </div>

      <div
        id="loginMessage"
        class="success-message"
        role="alert"
        aria-live="polite"
      ></div>

      <form
        class="container1"
        id="customerLoginForm"
        action="/customerLogin"
        method="POST"
        novalidate
      >
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />
          <span id="email-error" class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
          <span id="password-error" class="error-message"></span>
        </div>

        <div class="form-group">
          <a
            href="#"
            style="
              float: right;
              color: #007bff;
              text-decoration: none;
              font-size: 0.9rem;
            "
            >Forgot Password?</a
          >
        </div>

        <button type="submit" class="login-btn">
          <span class="button-text">Login</span>
        </button>
      </form>

      <div class="divider">Or</div>

      <button type="button" id="googleLoginBtn" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path
            fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19c1.33-4.02 5.33-6.91 10.46-6.91z"
          ></path>
          <path
            fill="#34A853"
            d="M24 44.5c6.47 0 11.9-2.38 15.89-6.55l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.05 0-11.2-4.03-13.02-9.42l-8.03 6.24C6.51 38.62 14.62 44.5 24 44.5z"
          ></path>
          <path
            fill="#4285F4"
            d="M43.56 17.4H42V17H24v10h11.84c-.48 1.45-1.27 2.78-2.15 3.82l7.73 6c2.26-2.09 3.71-5.05 3.71-8.82 0-1.14-.13-2.29-.39-3.39z"
          ></path>
          <path
            fill="#FBBC04"
            d="M6.4 12.7c-.54 1.45-.86 2.99-.86 4.7s.32 3.25.86 4.7l-7.98-6.19C.56 15.52 0 12.14 0 8.5s.56-6.93 1.42-9.99l7.98 6.19z"
          ></path>
        </svg>
        Sign in with Google
      </button>

      <div class="signup-link">
        Don't have an account? <a href="/customerSignUp">Sign up here</a>
      </div>

      <div class="back-link">
        <a href="/">← Back to Home</a>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    ></script>

    <!-- Customer Login JS -->
    <script src="/js/customerLogin.js"></script>
    <!-- Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
