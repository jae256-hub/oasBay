<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Login - Oyera Auto Service Bay</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/oyera.css" />
  </head>
  <body action="login" method="POST">
    <div class="auth-shell login-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Oyera Login</h1>
        </div>

        <div
          id="loginMessage"
          class="auth-notice"
          role="alert"
          aria-live="polite"
        ></div>

        <form id="loginForm" action="/login" method="POST" novalidate>
          <div class="form-group mb-3">
            <label for="emailOrPhone" class="form-label"
              >Email address or Phone Number</label
            >
            <input
              type="text"
              class="form-control auth-input"
              id="emailOrPhone"
              name="emailOrPhone"
              placeholder="you@example.com or +256..."
              required
            />
            <span class="error-message" id="emailOrPhone-error"></span>
          </div>

          <div class="form-group mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control auth-input"
              id="password"
              name="password"
              placeholder="Your password"
              required
            />
            <span class="error-message" id="password-error"></span>
          </div>

          <button type="submit" class="glass-btn">Login</button>
        </form>

        <div class="divider-row"><span>Or continue with</span></div>

        <p class="link-row">
          Don't have an account? <a href="/signUp">Sign up here</a>
        </p>
        <p class="link-row">
          <a href="/">← Back to Home</a>
        </p>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    ></script>

    <!-- Customer Login JS -->
    <script src="/js/login.js" defer></script>
    <!-- Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
