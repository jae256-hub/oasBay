<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Oyera Auto Service Bay</title>
    <link rel="stylesheet" href="/css/oyera.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="auth-shell login-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Payment Checkout</h1>
          <p class="auth-subtitle">
            Complete payment using your preferred method.
          </p>
        </div>

        <div id="checkoutMessage" class="auth-notice" role="alert"></div>

        <form id="checkoutForm" class="auth-form" novalidate>
          <div class="form-group mb-3">
            <label for="requestId" class="form-label">Request ID</label>
            <input
              type="text"
              class="form-control auth-input"
              id="requestId"
              name="requestId"
              placeholder="Enter service request ID"
              required
            />
          </div>
          <div class="form-group mb-3">
            <label for="paymentMethod" class="form-label">Payment Method</label>
            <select
              id="paymentMethod"
              name="paymentMethod"
              class="form-select auth-input"
              required
            >
              <option value="MasterCard">MasterCard</option>
              <option value="Mtn Mobile Money">Mtn Mobile Money</option>
              <option value="Airtel Mobile Money">Airtel Mobile Money</option>
              <option value="QR">QR Code</option>
            </select>
          </div>
          <button type="submit" class="auth-btn auth-btn-primary w-100">
            Pay Now
          </button>
        </form>
      </div>
    </div>

    <script src="/js/checkout.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
