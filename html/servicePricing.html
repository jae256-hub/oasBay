<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oyera Auto Service Bay | Service Pricing</title>
    <link rel="stylesheet" href="/css/oyera.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="admin" action="adminDashboard" method="POST" class="admin">
    <div class="dashboard-wrapper">
      <div class="sidebar">
        <div class="brand">
          <div class="brand-name">OAS Bay</div>
          <div class="brand-sub">Admin Console</div>
        </div>
        <div class="nav-item active" data-view="dashboard">
          <span class="nav-icon">▣</span
          ><span class="label-text">Admin Dashboard</span>
        </div>
        <div class="nav-item" data-view="records">
          <span class="nav-icon">🗎</span
          ><a href="/serviceRecords" class="label-text">Service Records</a>
        </div>
        <div class="nav-item" data-view="inventory">
          <span class="nav-icon">📦</span
          ><a href="/inventory" class="label-text">Inventory</a>
        </div>
        <div class="nav-item" data-view="users">
          <span class="nav-icon">👤</span
          ><a href="/userManagement" class="label-text">User Management</a>
        </div>
        <div class="nav-item" data-view="logs">
          <span class="nav-icon">🕒</span
          ><a href="/activityLogs" class="label-text">Activity Logs</a>
        </div>
        <div class="nav-item" data-view="pricing">
          <span class="nav-icon">🏷</span
          ><a href="/servicePricing" class="label-text">Service Pricing</a>
        </div>
        <div class="nav-item" data-view="payments">
          <span class="nav-icon">💳</span
          ><a href="/paymentPortal" class="label-text">Payment Portal</a>
        </div>
        <div class="nav-item">
          <span class="nav-icon">⎋</span
          ><a href="/logout" class="label-text">Logout</a>
        </div>
        <div class="sidebar-foot label-text">
          Oyera Auto Service Bay<br />v0.1 prototype
        </div>
      </div>

    <div class="page-shell">
      <header class="topbar">
        <h1>Service Pricing</h1>
      </header>

      <section class="summary-cards">
        <div class="summary-card">
          <div class="label">Standard Plans</div>
          <div class="value" id="planCount">0</div>
        </div>
        <div class="summary-card">
          <div class="label">Average Price</div>
          <div class="value" id="avgPrice">UGX 0</div>
        </div>
      </section>

      <section class="main-grid">
        <div class="panel">
          <h3>Add Pricing</h3>
          <form id="pricingForm" class="stack-form">
            <input
              type="text"
              name="serviceName"
              placeholder="Service name"
              required
            />
            <input type="number" name="price" placeholder="Price" required />
            <textarea
              name="description"
              placeholder="Service description"
            ></textarea>
            <button type="submit" class="btn btn-primary">Add plan</button>
          </form>
        </div>

        <div class="panel">
          <h3>Pricing List</h3>
          <div id="pricingList" class="inventory-list"></div>
        </div>
      </section>
    </div>

    <script src="/js/servicePricing.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
