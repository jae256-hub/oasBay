<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oyera Auto Service Bay | Activity Logs</title>
    <link rel="stylesheet" href="/css/oyera.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <h1>Activity Logs</h1>
      </header>

      <section class="summary-cards">
        <div class="summary-card">
          <div class="label">Log Entries</div>
          <div class="value" id="logCount">0</div>
        </div>
      </section>

      <section class="table-wrap panel mt-4">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Action</th>
                <th>Message</th>
                <th>Actor</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="logsTableBody">
              <tr>
                <td colspan="4" class="text-center text-muted">
                  Loading activity...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/js/activityLogs.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
