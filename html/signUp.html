<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/oyera.css" />
  </head>
  <body action="signUp" method="POST" id="customerSignUp">
    <div class="auth-shell">
      <div class="auth-card auth-card-lg">
        <div class="auth-header">
          <h1 class="auth-title">Create User Account</h1>
          <p class="auth-subtitle">
            Sign up to manage your auto service requests quickly and securely.
          </p>
        </div>

        <div
          id="signupMessage"
          class="auth-notice"
          role="alert"
          aria-live="polite"
        ></div>

        <form
          id="customerSignUpForm"
          action="/signUp"
          method="POST"
          novalidate
          class="auth-form"
        >
          <div class="row g-3">
            <div class="col-md-6">
              <label for="firstName" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control auth-input"
                id="firstName"
                name="firstName"
                placeholder="John"
                required
              />
              <span class="error-message" id="firstName-error"></span>
            </div>
            <div class="col-md-6">
              <label for="surname" class="form-label">Surname</label>
              <input
                type="text"
                class="form-control auth-input"
                id="surname"
                name="surname"
                placeholder="Doe"
                required
              />
              <span class="error-message" id="surname-error"></span>
            </div>
          </div>
          <div>
            <p>Select Role</p>
            <select
              aria-label="select-option"
              id="role"
              name="role"
              class="form-select auth-input"
            >
              <option value="Technician" selected>Technician</option>
            </select>
          </div>

          <div class="form-group mt-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control auth-input"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
            <span class="error-message" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control auth-input"
              id="password"
              name="password"
              placeholder="Choose a strong password"
              required
            />
            <span class="error-message" id="password-error"></span>
          </div>

          <div class="form-group">
            <label for="telephone" class="form-label">Telephone</label>
            <input
              type="tel"
              class="form-control auth-input"
              id="telephone"
              name="telephone"
              placeholder="+1234567890"
              required
            />
            <span class="error-message" id="telephone-error"></span>
          </div>

          <button type="submit" class="auth-btn auth-btn-primary w-100 mt-2">
            Create Account
          </button>
        </form>

        <p class="link-row mt-4">
          Already have an account? <a href="/login">Login here</a>
        </p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/js/signUp.js" defer></script>
  </body>
</html>
