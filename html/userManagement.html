<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
    <link rel="stylesheet" href="/css/oyera.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <h1>User Management</h1>
      </header>

      <section class="summary-cards">
        <div class="summary-card">
          <div class="label">Total Users</div>
          <div class="value" id="userCount">0</div>
        </div>
        <div class="summary-card">
          <div class="label">Admins</div>
          <div class="value" id="adminCount">0</div>
        </div>
        <div class="summary-card">
          <div class="label">Technicians</div>
          <div class="value" id="techCount">0</div>
        </div>
      </section>

      <section class="main-grid">
        <div class="panel">
          <h3>Add User</h3>
          <form id="addUserForm" class="stack-form">
            <input
              type="text"
              name="firstName"
              placeholder="First name"
              required
            />
            <input type="text" name="surname" placeholder="Surname" required />
            <input type="email" name="email" placeholder="Email" required />
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <input
              type="tel"
              name="telephone"
              placeholder="Telephone"
              required
            />
            <select name="role">
              <option value="Admin">Admin</option>
              <option value="Technician">Technician</option>
              <option value="Senior Technician">Senior Technician</option>
            </select>
            <button type="submit" class="btn btn-primary">Add user</button>
          </form>
        </div>

        <div class="panel">
          <h3>Edit User</h3>
          <form id="editUserForm" class="stack-form">
            <input
              type="text"
              name="firstName"
              placeholder="First name"
              required
            />
            <input type="text" name="surname" placeholder="Surname" required />
            <input
              type="tel"
              name="telephone"
              placeholder="Telephone"
              required
            />
            <select name="role">
              <option value="Admin">Admin</option>
              <option value="Technician">Technician</option>
              <option value="Senior Technician">Senior Technician</option>
            </select>
            <button type="submit" class="btn btn-warning">Save changes</button>
          </form>
        </div>
      </section>

      <section class="table-wrap panel mt-4">
        <h3>Registered Users</h3>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Joined</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr>
                <td colspan="6" class="text-center text-muted">
                  Loading users...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/js/userManagement.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
