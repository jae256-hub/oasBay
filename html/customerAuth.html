<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Auth - Oyera</title>
    <link rel="stylesheet" href="/css/oyera.css" />
  </head>
  <body>
    <h1>Customer Authentication</h1>
    <div id="messages"></div>

    <section id="login">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Email: <input name="email" type="email" required /></label><br />
        <label
          >Password: <input name="password" type="password" required /></label
        ><br />
        <button type="submit">Login</button>
      </form>
    </section>

    <section id="signup">
      <h2>Sign Up</h2>
      <form id="signupForm">
        <label>First name: <input name="firstName" required /></label><br />
        <label>Surname: <input name="surname" required /></label><br />
        <label>Email: <input name="email" type="email" required /></label><br />
        <label
          >Password:
          <input
            name="password"
            type="password"
            minlength="6"
            required /></label
        ><br />
        <label>Telephone: <input name="telephone" /></label><br />
        <button type="submit">Sign Up</button>
      </form>
    </section>

    <script src="/js/customerAuth.js"></script>
  </body>
</html>
