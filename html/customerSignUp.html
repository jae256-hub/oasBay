<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/oyera.css" />
  </head>
  <body action="customerSignUp" method="POST" id="customerSignUp">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h1 class="text-center mb-4">Create Customer Account</h1>
              <p class="text-center text-muted">
                Sign up to manage your auto service requests.
              </p>

              <form
                id="customerSignUpForm"
                action="/customerSignUp"
                method="POST"
              >
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input
                      type="text"
                      class="form-control glass-input"
                      id="firstName"
                      name="firstName"
                      required
                    />
                    <span class="error-message" id="firstName-error"></span>
                  </div>
                  <div class="col-md-6">
                    <label for="surname" class="form-label">Surname</label>
                    <input
                      type="text"
                      class="form-control glass-input"
                      id="surname"
                      name="surname"
                      required
                    />
                    <span class="error-message" id="surname-error"></span>
                  </div>
                </div>

                <div class="mb-3 mt-3">
                  <label for="email" class="form-label">Email address</label>
                  <input
                    type="email"
                    class="form-control glass-input"
                    id="email"
                    name="email"
                    required
                  />
                  <span class="error-message" id="email-error"></span>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control glass-input"
                    id="password"
                    name="password"
                    required
                  />
                  <span class="error-message" id="password-error"></span>
                </div>

                <div class="mb-3">
                  <label for="telephone" class="form-label">Telephone</label>
                  <input
                    type="text"
                    class="form-control glass-input"
                    id="telephone"
                    name="telephone"
                    required
                  />
                  <span class="error-message" id="telephone-error"></span>
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn glass-btn glass-btn-primary">
                    Create Account
                  </button>
                </div>
              </form>

              <div
                id="signupMessage"
                class="mt-3 text-center small"
                aria-live="polite"
              ></div>

              <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="/customerLogin">Login here</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/js/customerSignUp.js"></script>
  </body>
</html>
